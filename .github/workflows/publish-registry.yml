name: Retire the old registry name

# From 0.4.55 (4 Nov 2026) the server is listed in the official MCP registry (registry.modelcontextprotocol.io) as
# com.prometiam/risk-mcp, a name proved by a DNS record on prometiam.com and published from the maintainers' machine.
# GitHub OIDC can only act for io.github.matiasmaquieira96/*, so this job no longer publishes: it marks every version of
# the old name io.github.matiasmaquieira96/risk-mcp deprecated, pointing to the new one. It runs when this file changes
# or by hand; running it again only repeats the same status.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-registry.yml'

jobs:
  deprecate-old-name:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the OIDC token
      contents: read
    steps:
      - name: Install mcp-publisher 1.8.7 (checked against the release's checksums file)
        run: |
          base=https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7
          curl -fsSL "$base/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher_linux_amd64.tar.gz
          curl -fsSL "$base/registry_1.8.7_checksums.txt" -o checksums.txt
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Log in via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Deprecate every version of the old name
        run: |
          ./mcp-publisher status --status deprecated --all-versions \
            --message "Renamed: this server is now com.prometiam/risk-mcp (same npm package, prometiam-risk-mcp)" \
            io.github.matiasmaquieira96/risk-mcp
